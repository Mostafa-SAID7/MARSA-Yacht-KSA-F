version: 2
updates:
  # Maintain dependencies for npm in the Angular project
  - package-ecosystem: "npm"
    directory: "/marsa"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "npm"
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "rxjs"
          - "zone.js"

  # Maintain dependencies for GitHub Actions in the root directory
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "actions"
