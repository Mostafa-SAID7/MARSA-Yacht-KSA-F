    <!-- ── About / Marina ── -->
    <section class="w-full section-offscreen bg-transparent" id="about" aria-labelledby="marina-title">
      <div class="section-panel">
      <div class="grid-2 gap-12 md:gap-16 items-center">
        <div class="relative h-72 md:h-96 rounded-marsa-md overflow-hidden order-2 md:order-1">
          <img src="/assets/marsa-marina.jpg" alt="Marina at dusk" loading="lazy" decoding="async" class="w-full h-full object-cover" />
          <div class="absolute inset-0 bg-gradient-to-t from-marsa-deep/50 to-transparent"></div>
          <span class="absolute bottom-4 left-4 px-3 py-1.5 bg-marsa-deep/80 backdrop-blur-sm text-marsa-pearl text-[9px] font-mono tracking-[0.14em] rounded">JEDDAH / 21° 32′ N</span>
        </div>
        <div class="order-1 md:order-2">
          <p class="eyebrow mb-5"><span class="eyebrow-line"></span>{{ text(copy.sections.marinaEyebrow) }}</p>
          <h2 id="marina-title" class="mb-6">{{ text(copy.sections.marinaTitle) }}</h2>
          <p class="opacity-60 mb-8 leading-relaxed">{{ text(copy.sections.marinaBody) }}</p>
          <div class="grid grid-cols-2 gap-3 mb-10">
            <div class="flex items-center gap-2.5 text-sm font-medium opacity-70">
              <svg lucideAnchor class="w-3.5 h-3.5 text-marsa-sand dark:text-marsa-sand-deep shrink-0" aria-hidden="true"></svg>
              Marina delivery
            </div>
            <div class="flex items-center gap-2.5 text-sm font-medium opacity-70">
              <svg lucideAnchor class="w-3.5 h-3.5 text-marsa-sand dark:text-marsa-sand-deep shrink-0" aria-hidden="true"></svg>
              Yacht support
            </div>
            <div class="flex items-center gap-2.5 text-sm font-medium opacity-70">
              <svg lucideAnchor class="w-3.5 h-3.5 text-marsa-sand dark:text-marsa-sand-deep shrink-0" aria-hidden="true"></svg>
              Crew assistance
            </div>
            <div class="flex items-center gap-2.5 text-sm font-medium opacity-70">
              <svg lucideAnchor class="w-3.5 h-3.5 text-marsa-sand dark:text-marsa-sand-deep shrink-0" aria-hidden="true"></svg>
              Special requests
            </div>
          </div>
          <button class="link-accent group/btn" type="button" (click)="requestService.emit()">
            {{ text(copy.sections.concierge) }}
            <svg lucideArrowUpRight class="w-3.5 h-3.5 transition-transform group-hover/btn:translate-x-0.5 group-hover/btn:-translate-y-0.5" aria-hidden="true"></svg>
          </button>
        </div>
      </div>
      </div>
    </section>
