    <!-- ── Destinations ── -->
    <section class="w-full section-offscreen bg-transparent" id="destinations" aria-labelledby="destinations-title">
      <div class="max-w-5xl mx-auto px-6 md:px-8 py-20 md:py-28 bg-marsa-deep dark:bg-marsa-dark-deep text-marsa-pearl border-t border-marsa-pearl/10 dark:border-marsa-dark-pearl/10">
        <div class="mb-16 reveal">
          <p class="eyebrow mb-4"><span class="eyebrow-line"></span>{{ text(copy.sections.destinationsEyebrow) }}</p>
          <h2 id="destinations-title" class="mb-6">{{ text(copy.sections.destinationsTitle) }}</h2>
          <p class="text-lg opacity-60 max-w-xl leading-relaxed">{{ text(copy.sections.destinationsBody) }}</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
          <article class="group relative h-80 rounded-marsa-md overflow-hidden reveal cursor-pointer"
            *ngFor="let destination of destinations; let i = index"
            [style]="'animation-delay: ' + (i * 80) + 'ms'">
            <img [src]="destination.image" [alt]="text(destination.name)" loading="lazy" decoding="async" class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" />
            <div class="absolute inset-0 bg-gradient-to-t from-marsa-deep/90 via-marsa-deep/30 to-transparent group-hover:from-marsa-deep transition-all duration-500"></div>
            <div class="absolute inset-0 p-6 flex flex-col justify-end">
              <span class="text-[10px] font-mono opacity-50 mb-2 tracking-[0.12em]">{{ text(destination.detail) }}</span>
              <h3 class="text-2xl font-bold mb-2 -tracking-[0.02em]">{{ text(destination.name) }}</h3>
              <p class="text-sm opacity-70 mb-5 leading-relaxed">{{ text(destination.description) }}</p>
              <a href="#contact" class="link-accent text-marsa-sand group/link">
                {{ text(copy.sections.explore) }}
                <svg lucideArrowUpRight class="w-3.5 h-3.5 transition-transform group-hover/link:translate-x-0.5 group-hover/link:-translate-y-0.5" aria-hidden="true"></svg>
              </a>
            </div>
          </article>
        </div>
      </div>
    </section>
