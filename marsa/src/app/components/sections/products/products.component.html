    <!-- ── Products ── -->
    <section class="w-full section-offscreen bg-transparent" aria-labelledby="products-title">
      <div class="section-panel">
      <div class="mb-16 reveal">
        <p class="eyebrow mb-4"><span class="eyebrow-line"></span>{{ text(copy.sections.productsEyebrow) }}</p>
        <h2 id="products-title" class="mb-6">{{ text(copy.sections.productsTitle) }}</h2>
        <p class="text-lg opacity-60 max-w-xl leading-relaxed">{{ text(copy.sections.productsBody) }}</p>
      </div>

      <div class="grid-3 mb-12">
        <article class="group reveal card"
          *ngFor="let product of products; let i = index"
          [style]="'animation-delay: ' + (i * 80) + 'ms'">
          <div class="card-image h-56">
            <img [src]="product.image" [alt]="text(product.name)" loading="lazy" decoding="async" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" />
            <div class="absolute inset-0 bg-gradient-to-t from-marsa-deep/50 to-transparent"></div>
            <span class="absolute top-4 left-4 px-2.5 py-1 bg-marsa-deep/70 backdrop-blur-sm text-marsa-pearl text-[9px] font-bold rounded-full tracking-widest uppercase">{{ text(product.category) }}</span>
            <button class="absolute bottom-4 right-4 w-9 h-9 rounded-full bg-marsa-sand hover:bg-marsa-sand-deep text-marsa-deep font-bold transition-all hover:scale-110 flex items-center justify-center"
              type="button" (click)="requestService.emit()" [attr.aria-label]="text(copy.sections.request)">
              <svg lucidePlus class="w-4 h-4" aria-hidden="true"></svg>
            </button>
          </div>
          <div class="card-content">
            <h3 class="font-bold mb-1 -tracking-[0.02em]">{{ text(product.name) }}</h3>
            <p class="text-sm opacity-50 mb-3 leading-relaxed">{{ text(product.description) }}</p>
            <span class="text-xs font-bold opacity-60 font-mono">{{ product.price }}</span>
          </div>
        </article>
      </div>

      <button class="inline-flex items-center gap-2.5 px-6 py-3 border border-marsa-pearl/30 hover:border-marsa-sand text-marsa-pearl hover:text-marsa-sand font-bold text-[12px] rounded-full transition-all tracking-wide"
        type="button" (click)="requestService.emit()">
        {{ text(copy.sections.viewCollection) }}
        <svg lucideArrowUpRight class="w-3.5 h-3.5" aria-hidden="true"></svg>
      </button>
      </div>
    </section>
