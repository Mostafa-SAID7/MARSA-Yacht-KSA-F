    <!-- ── Services ── -->
    <section class="w-full section-offscreen bg-transparent" id="services" aria-labelledby="services-title">
      <div class="max-w-5xl mx-auto px-6 md:px-8 py-20 md:py-28 bg-marsa-deep dark:bg-marsa-dark-deep text-marsa-pearl">
        <div class="mb-16 reveal">
          <p class="eyebrow mb-4"><span class="eyebrow-line"></span>{{ text(copy.sections.servicesEyebrow) }}</p>
          <h2 id="services-title" class="mb-6">{{ text(copy.sections.servicesTitle) }}</h2>
          <p class="text-lg opacity-80 max-w-xl leading-relaxed">{{ text(copy.sections.servicesBody) }}</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <article class="group reveal card bg-[#121415] dark:bg-marsa-dark-ink border border-transparent hover:border-marsa-sand/30 transition-colors"
            *ngFor="let service of services; let i = index"
            [style]="'animation-delay: ' + (i * 80) + 'ms'">
            <div class="card-image">
              <img [src]="service.image" [alt]="text(service.title)" loading="lazy" decoding="async" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" />
              <div class="absolute inset-0 bg-gradient-to-t from-marsa-deep/50 to-transparent"></div>
              <span class="absolute top-4 left-4 px-3 py-1 bg-marsa-sand/95 text-marsa-deep text-[10px] font-bold rounded-full tracking-widest">{{ service.eyebrow }}</span>
            </div>
            <div class="card-content">
              <h3 class="text-lg font-bold mb-2 -tracking-[0.02em]">{{ text(service.title) }}</h3>
              <p class="text-sm opacity-60 mb-5 leading-relaxed">{{ text(service.description) }}</p>
              <a href="#provisioning" class="link-accent group/link text-marsa-sand" [attr.aria-label]="text(service.title)">
                {{ text(copy.sections.explore) }}
                <svg lucideArrowUpRight class="w-3.5 h-3.5 transition-transform group-hover/link:translate-x-0.5 group-hover/link:-translate-y-0.5" aria-hidden="true"></svg>
              </a>
            </div>
          </article>
        </div>
      </div>
    </section>
